<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Cek Update Progress BRT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#0b1120; --bg2:#0e1729; --card:#141d33; --card-border:#232f4d;
    --text:#e7ebf5; --sub:#8b95ab; --accent:#3b6ef6; --accent2:#6d9bff; --accent-soft:#1b2a4d;
    --green:#22c55e; --orange:#f59e0b; --red:#ef4444;
    --shadow:0 4px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:32px;}
  header{background:var(--bg2); padding:16px; position:sticky; top:0; z-index:1000; border-bottom:1px solid var(--card-border); display:flex; align-items:center; gap:12px;}
  .back-btn{width:34px; height:34px; border-radius:9px; background:var(--card); border:1px solid var(--card-border); color:var(--accent2); display:flex; align-items:center; justify-content:center; font-size:16px; text-decoration:none; flex-shrink:0;}
  header h1{margin:0; font-size:16px; font-weight:800;}
  header p{margin:2px 0 0; font-size:11px; color:var(--sub);}
  .refresh{margin-left:auto; background:var(--card); border:1px solid var(--card-border); color:var(--accent2); border-radius:9px; width:34px; height:34px; font-size:15px; cursor:pointer;}

  #map{height:270px; width:100%; background:#0a0f1d; border-bottom:1px solid var(--card-border);}
  .leaflet-container{font-family:inherit;}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card); color:var(--text);}
  .leaflet-popup-content{margin:10px 12px; font-size:12px; line-height:1.4;}
  .pop-t{font-weight:800; font-size:12.5px;} .pop-s{color:var(--sub); font-size:11px; margin-top:2px;}
  .pop-img{display:block; margin-top:7px; width:150px; height:100px; object-fit:cover; border-radius:8px; border:1px solid var(--card-border);}
  .nomap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:12px; text-align:center; padding:20px; pointer-events:none; z-index:500;}
  .mapwrap{position:relative;}

  .section{padding:12px 14px;}
  .chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 8px; -webkit-overflow-scrolling:touch;}
  .chip{flex:0 0 auto; padding:7px 12px; border-radius:999px; border:1px solid var(--card-border); background:var(--card); color:var(--sub); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;}
  .chip.on{background:var(--accent-soft); color:var(--accent2); border-color:var(--accent);}
  .sum{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:4px 0 12px;}
  .sum div{background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:9px 6px; text-align:center;}
  .sum b{display:block; font-size:18px;} .sum span{font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.3px; font-weight:700;}

  .upd{background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:13px; margin-bottom:10px; box-shadow:var(--shadow);}
  .upd.focus{border-color:var(--accent2);}
  .u-top{display:flex; align-items:center; gap:8px;}
  .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .u-title{font-size:13.5px; font-weight:800;}
  .u-time{margin-left:auto; font-size:11px; color:var(--sub); white-space:nowrap;}
  .u-user{font-size:11px; color:var(--sub); margin:3px 0 0 18px;}
  .u-items{margin:9px 0 0; display:flex; flex-direction:column; gap:5px;}
  .u-item{font-size:12.5px; background:var(--bg2); border:1px solid var(--card-border); border-radius:9px; padding:6px 9px; display:flex; justify-content:space-between; gap:8px;}
  .u-item .d{color:var(--green); font-weight:800;} .u-item .d.neg{color:var(--red);}
  .u-cat{margin-top:9px; font-size:12.5px; color:var(--text); background:var(--bg2); border-left:3px solid var(--accent); border-radius:6px; padding:7px 10px; white-space:pre-wrap;}
  .u-photos{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px;}
  .u-photos img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; border:1px solid var(--card-border); cursor:pointer; background:var(--bg2);}
  .u-foot{margin-top:10px; font-size:11.5px;}
  .u-foot a,.u-foot span{color:var(--accent2); font-weight:700; cursor:pointer; text-decoration:none;}
  .u-foot .none{color:var(--sub); font-weight:500; cursor:default;}
  .more{display:block; width:100%; padding:11px; border-radius:11px; border:1px solid var(--card-border); background:var(--card); color:var(--accent2); font-weight:700; font-size:13px; font-family:inherit; cursor:pointer;}
  .loading,.empty{font-size:13px; color:var(--sub); text-align:center; padding:22px 10px;}

  #lb{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:3000; display:none; align-items:center; justify-content:center;}
  #lb img{max-width:96vw; max-height:90vh; border-radius:8px;}
  #lb .x{position:absolute; top:14px; right:16px; color:#fff; font-size:28px; cursor:pointer; line-height:1;}
</style>
</head>
<body>

<header>
  <a class="back-btn" href="HalamanDepan.html" aria-label="Kembali">&#8592;</a>
  <div>
    <h1>Cek Update Progress</h1>
    <p>BRT Medan &middot; Update aktual lapangan</p>
  </div>
  <button class="refresh" id="btnRefresh" aria-label="Muat ulang">&#8635;</button>
</header>

<div class="mapwrap"><div id="map"></div><div class="nomap" id="nomap" style="display:none">Belum ada update dengan lokasi GPS</div></div>

<div class="section">
  <div class="chips" id="chipsZona"></div>
  <div class="chips" id="chipsPeriod"></div>
  <div class="sum" id="sum"></div>
  <div id="list"><div class="loading">Memuat update&hellip;</div></div>
</div>

<div id="lb"><span class="x" id="lbX">&times;</span><img id="lbImg" alt="foto" /></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  var API_URL = 'https://script.google.com/macros/s/AKfycbyIYDJ4Btr5MuTNsK8PcqICFm0woRzbK7gV91igtabsBiM_quoIvsOYJy1OvkszlSZYrQ/exec';

  // ---- Pemanggil API yang tahan gangguan (Safari/HP): baca teks dulu, coba ulang, cadangkan hasil terakhir ----
  function apiGet(url, tries){
    tries = tries || 3;
    var key = 'apicache:' + url;
    function showStale(){
      if (document.getElementById('staleBanner')) return;
      var b = document.createElement('div');
      b.id = 'staleBanner';
      b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:4000;background:#3a2a0b;color:#fbbf24;border:1px solid #7a5a12;border-radius:10px;padding:8px 12px;font-size:12px;text-align:center;';
      b.textContent = '⚠ Server belum merespons — menampilkan data tersimpan terakhir';
      document.body.appendChild(b);
      setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 6000);
    }
    function attempt(n){
      return fetch(url).then(function(res){ return res.text(); }).then(function(t){
        var d;
        try { d = JSON.parse(t); }
        catch (e) { throw new Error('Server belum merespons dengan benar, coba lagi sebentar'); }
        try { localStorage.setItem(key, t); } catch (e) {}
        return d;
      }).catch(function(err){
        if (n < tries) {
          return new Promise(function(r){ setTimeout(r, 900 * n); }).then(function(){ return attempt(n + 1); });
        }
        var c = null;
        try { c = localStorage.getItem(key); } catch (e) {}
        if (c) { try { var d2 = JSON.parse(c); showStale(); return d2; } catch (e) {} }
        throw err;
      });
    }
    return attempt(1);
  }

  var tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  var ZONA_COLORS = { '1': '#3b6ef6', '2': '#f59e0b', '3': '#22c55e' };
  var all = [];
  var F = { zona: 'all', period: '7' };
  var shown = 20;
  var map = null, layer = null, pins = {};

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function zonaKey(z){ var m = /ZONA\s*(\d)/i.exec(z || ''); return m ? m[1] : '0'; }
  function zonaColor(z){ return ZONA_COLORS[zonaKey(z)] || '#8b95ab'; }
  function zonaShort(z){ var k = zonaKey(z); return k === '0' ? (z || 'Zona') : 'Zona ' + k; }
  function safeId(id){ return String(id).replace(/[^A-Za-z0-9_-]/g, ''); }
  function thumb(id, sz){ return 'https://drive.google.com/thumbnail?id=' + safeId(id) + '&sz=w' + sz; }
  function fmtNum(n){ return Number(n).toLocaleString('id-ID', { maximumFractionDigits: 2 }); }
  function dayKey(d){ return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' }); }

  function relTime(d){
    var diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'baru saja';
    if (diff < 3600) return Math.floor(diff / 60) + ' menit lalu';
    if (diff < 86400 && dayKey(d) === dayKey(new Date())) return Math.floor(diff / 3600) + ' jam lalu';
    var t = d.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' }).replace('.', ':');
    var yest = dayKey(new Date(Date.now() - 86400000));
    if (dayKey(d) === yest) return 'Kemarin ' + t;
    return d.toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short' }) + ' ' + t;
  }

  function parse(u){ u._d = new Date(u.time); if (isNaN(u._d)) u._d = new Date(0); u._hasGeo = typeof u.lat === 'number' && typeof u.lng === 'number'; return u; }

  function filtered(){
    var today = dayKey(new Date());
    var cut = F.period === '7' ? Date.now() - 7 * 86400000 : 0;
    return all.filter(function(u){
      if (F.zona !== 'all' && zonaKey(u.zona) !== F.zona) return false;
      if (F.period === 'today') return dayKey(u._d) === today;
      if (F.period === '7') return u._d.getTime() >= cut;
      return true;
    });
  }

  // ---------- chips ----------
  function renderChips(){
    var zs = {}; all.forEach(function(u){ zs[zonaKey(u.zona)] = u.zona; });
    var zhtml = '<button class="chip' + (F.zona === 'all' ? ' on' : '') + '" data-z="all">Semua Zona</button>' +
      Object.keys(zs).sort().map(function(k){
        return '<button class="chip' + (F.zona === k ? ' on' : '') + '" data-z="' + k + '">' + esc(zonaShort(zs[k])) + '</button>';
      }).join('');
    var zc = document.getElementById('chipsZona'); zc.innerHTML = zhtml;
    Array.prototype.forEach.call(zc.querySelectorAll('.chip'), function(b){
      b.addEventListener('click', function(){ F.zona = b.getAttribute('data-z'); shown = 20; renderAll(); });
    });
    var P = [['today', 'Hari ini'], ['7', '7 hari'], ['all', 'Semua']];
    var pc = document.getElementById('chipsPeriod');
    pc.innerHTML = P.map(function(p){ return '<button class="chip' + (F.period === p[0] ? ' on' : '') + '" data-p="' + p[0] + '">' + p[1] + '</button>'; }).join('');
    Array.prototype.forEach.call(pc.querySelectorAll('.chip'), function(b){
      b.addEventListener('click', function(){ F.period = b.getAttribute('data-p'); shown = 20; renderAll(); });
    });
  }

  // ---------- map ----------
  function initMap(){
    if (map || !window.L) return;
    map = L.map('map', { zoomControl: true, attributionControl: true }).setView([3.5952, 98.6722], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }

  function popupHtml(u){
    var h = '<div class="pop-t">' + esc(zonaShort(u.zona)) + ' &middot; ' + esc(u.segmen) + '</div>' +
      '<div class="pop-s">' + esc(relTime(u._d)) + (u.user ? ' &middot; ' + esc(u.user) : '') + '</div>';
    if (u.summary) h += '<div class="pop-s" style="color:#e7ebf5;margin-top:5px">' + esc(u.summary) + '</div>';
    if (u.photos && u.photos.length) h += '<img class="pop-img" src="' + thumb(u.photos[0], 300) + '" alt="foto" />';
    return h;
  }

  function renderMap(list){
    initMap();
    var geo = list.filter(function(u){ return u._hasGeo; });
    document.getElementById('nomap').style.display = geo.length ? 'none' : 'flex';
    if (!map) return;
    layer.clearLayers(); pins = {};
    var pts = [];
    geo.forEach(function(u){
      var c = zonaColor(u.zona);
      var m = L.circleMarker([u.lat, u.lng], { radius: 9, color: '#fff', weight: 2, fillColor: c, fillOpacity: .95 })
        .bindPopup(popupHtml(u)).addTo(layer);
      pins[u._i] = m; pts.push([u.lat, u.lng]);
    });
    if (pts.length === 1) map.setView(pts[0], 16);
    else if (pts.length > 1) map.fitBounds(pts, { padding: [30, 30], maxZoom: 17 });
    setTimeout(function(){ map.invalidateSize(); }, 50);
  }

  // ---------- summary + list ----------
  function renderSummary(list){
    var today = dayKey(new Date());
    var tdy = all.filter(function(u){ return dayKey(u._d) === today && (F.zona === 'all' || zonaKey(u.zona) === F.zona); });
    var ph = 0; tdy.forEach(function(u){ ph += (u.photos || []).length; });
    var seg = {}; tdy.forEach(function(u){ seg[u.zona + '|' + u.segmen] = 1; });
    document.getElementById('sum').innerHTML =
      '<div><b>' + tdy.length + '</b><span>Update hari ini</span></div>' +
      '<div><b>' + Object.keys(seg).length + '</b><span>Segmen aktif</span></div>' +
      '<div><b>' + ph + '</b><span>Foto hari ini</span></div>';
  }

  function itemLine(it){
    var d = Number(it.after) - Number(it.before || 0);
    var unit = it.unit ? ' ' + it.unit : '';
    var dtxt = d === 0 ? '±0' : (d > 0 ? '+' : '−') + fmtNum(Math.abs(d));
    return '<div class="u-item"><span>' + esc(it.label) + '</span><span><span class="d' + (d < 0 ? ' neg' : '') + '">' + dtxt + esc(unit) + '</span> &rarr; ' + fmtNum(it.after) + '</span></div>';
  }

  function cardHtml(u){
    var items = (u.items || []).length ? '<div class="u-items">' + u.items.map(itemLine).join('') + '</div>' : '';
    var cat = u.catatan ? '<div class="u-cat">' + esc(u.catatan) + '</div>' : '';
    var ph = (u.photos || []).length ? '<div class="u-photos">' + u.photos.slice(0, 4).map(function(id){
      return '<img loading="lazy" src="' + thumb(id, 400) + '" data-full="' + thumb(id, 1600) + '" alt="foto lapangan" />';
    }).join('') + '</div>' : '';
    var foot = u._hasGeo
      ? '<span data-pin="' + u._i + '">📍 lihat di peta</span>' + (u.acc ? ' <span class="none">(±' + Math.round(u.acc) + ' m)</span>' : '')
      : '<span class="none">tanpa lokasi</span>';
    return '<div class="upd" id="upd' + u._i + '">' +
      '<div class="u-top"><span class="dot" style="background:' + zonaColor(u.zona) + '"></span>' +
        '<div class="u-title">' + esc(zonaShort(u.zona)) + ' &middot; ' + esc(u.segmen) + '</div>' +
        '<div class="u-time">' + esc(relTime(u._d)) + '</div></div>' +
      (u.user ? '<div class="u-user">oleh ' + esc(u.user) + '</div>' : '') +
      items + cat + ph + '<div class="u-foot">' + foot + '</div></div>';
  }

  function renderList(list){
    var box = document.getElementById('list');
    if (!list.length) {
      box.innerHTML = '<div class="empty">' + (all.length ? 'Tidak ada update pada filter ini.' : 'Belum ada update lapangan. Kirim lewat menu Input Progress.') + '</div>';
      return;
    }
    var part = list.slice(0, shown);
    box.innerHTML = part.map(cardHtml).join('') +
      (list.length > shown ? '<button class="more" id="btnMore">Muat lebih banyak (' + (list.length - shown) + ')</button>' : '');
    var more = document.getElementById('btnMore');
    if (more) more.addEventListener('click', function(){ shown += 20; renderList(filtered()); });
    Array.prototype.forEach.call(box.querySelectorAll('[data-pin]'), function(el){
      el.addEventListener('click', function(){ focusPin(parseInt(el.getAttribute('data-pin'), 10)); });
    });
    Array.prototype.forEach.call(box.querySelectorAll('.u-photos img'), function(img){
      img.addEventListener('click', function(){ openLb(img.getAttribute('data-full')); });
    });
  }

  function focusPin(i){
    var m = pins[i];
    if (!m || !map) return;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 17));
    m.openPopup();
  }

  function openLb(src){ document.getElementById('lbImg').src = src; document.getElementById('lb').style.display = 'flex'; }
  document.getElementById('lb').addEventListener('click', function(){ this.style.display = 'none'; document.getElementById('lbImg').src = ''; });

  function renderAll(){
    renderChips();
    var list = filtered();
    renderSummary(list);
    renderMap(list);
    renderList(list);
  }

  function load(){
    apiGet(API_URL + '?action=brtUpdates&limit=200')
      .then(function(data){
        if (!data.ok) throw new Error(data.error || 'Gagal memuat data');
        all = (data.updates || []).map(function(u, i){ u._i = i; return parse(u); });
        renderAll();
      })
      .catch(function(err){
        document.getElementById('list').innerHTML = '<div class="empty">Gagal memuat: ' + esc(err.message) + '<br><br><button class="chip on" onclick="location.reload()">Coba lagi</button></div>';
        initMap();
      });
  }
  document.getElementById('btnRefresh').addEventListener('click', function(){
    document.getElementById('list').innerHTML = '<div class="loading">Memuat update&hellip;</div>';
    load();
  });
  initMap();
  load();
</script>
</body>
</html>
